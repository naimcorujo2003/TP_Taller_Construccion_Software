# Optional one-command startup: docker compose up --build
# Do not run together with backend/docker-compose.yml (same DB volume name and port).
services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: socioclub
      MYSQL_USER: socioclub
      MYSQL_PASSWORD: socioclub
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - socioclub-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: socioclub
      DB_PASSWORD: socioclub
    # Retry in case MySQL accepts the healthcheck but is still warming up
    restart: on-failure
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  app:
    build:
      context: ./app-socios
      args:
        # Browser-side URL of the backend; must match the published backend port
        REACT_APP_API_URL: http://localhost:${BACKEND_PORT:-8080}/api
    depends_on:
      - backend
    ports:
      # Host port must stay 3000: backend CORS only allows http://localhost:3000
      - "3000:80"

  sitio:
    image: nginx:alpine
    volumes:
      - ./sitio-publico:/usr/share/nginx/html:ro
    ports:
      - "8090:80"

volumes:
  socioclub-data:
