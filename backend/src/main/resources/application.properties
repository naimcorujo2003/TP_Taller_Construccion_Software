spring.application.name=socioclub
server.port=8080

# MySQL (defaults match docker-compose.yml; override with environment variables)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/socioclub?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Argentina/Cordoba
spring.datasource.username=${DB_USER:socioclub}
spring.datasource.password=${DB_PASSWORD:socioclub}

# Hibernate creates the tables, then data.sql loads the initial data
spring.jpa.hibernate.ddl-auto=create
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
