<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${titulo})}"></head>
<body>
<header th:replace="~{fragments/layout :: header('socios')}"></header>
<main class="contenedor">
    <h1 th:text="${titulo}">Nuevo socio</h1>

    <form class="formulario" th:action="@{${accion}}" th:object="${socio}" method="post">
        <div class="campo">
            <label for="dni">DNI</label>
            <input type="text" id="dni" th:field="*{dni}" placeholder="Sin puntos">
            <span class="error-campo" th:if="${#fields.hasErrors('dni')}" th:errors="*{dni}"></span>
        </div>
        <div class="campo">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" th:field="*{nombre}">
            <span class="error-campo" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></span>
        </div>
        <div class="campo">
            <label for="apellido">Apellido</label>
            <input type="text" id="apellido" th:field="*{apellido}">
            <span class="error-campo" th:if="${#fields.hasErrors('apellido')}" th:errors="*{apellido}"></span>
        </div>
        <div class="campo">
            <label for="fechaNacimiento">Fecha de nacimiento</label>
            <input type="date" id="fechaNacimiento" th:field="*{fechaNacimiento}">
            <span class="error-campo" th:if="${#fields.hasErrors('fechaNacimiento')}"
                  th:errors="*{fechaNacimiento}"></span>
        </div>
        <div class="campo">
            <label for="email">Email</label>
            <input type="email" id="email" th:field="*{email}">
            <span class="error-campo" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
        </div>
        <div class="campo">
            <label for="telefono">Teléfono</label>
            <input type="text" id="telefono" th:field="*{telefono}">
        </div>
        <div class="campo">
            <label for="estadoCuota">Estado de la cuota</label>
            <select id="estadoCuota" th:field="*{estadoCuota}">
                <option th:each="e : ${estados}" th:value="${e}"
                        th:text="${e.name() == 'MOROSO'} ? 'Moroso' : 'Al día'">Al día</option>
            </select>
        </div>

        <div class="botonera">
            <button type="submit" class="boton">Guardar</button>
            <a class="boton secundario" th:href="@{/socios}">Cancelar</a>
        </div>
    </form>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
