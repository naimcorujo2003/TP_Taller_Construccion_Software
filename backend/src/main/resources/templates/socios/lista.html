<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Socios')}"></head>
<body>
<header th:replace="~{fragments/layout :: header('socios')}"></header>
<main class="contenedor">
    <div class="barra-titulo">
        <h1>Socios</h1>
        <a class="boton" th:href="@{/socios/nuevo}">Nuevo socio</a>
    </div>
    <div th:replace="~{fragments/layout :: mensajes}"></div>

    <form class="filtro" method="get" th:action="@{/socios}">
        <label for="apellido">Apellido</label>
        <input type="text" id="apellido" name="apellido" th:value="${apellido}" placeholder="Buscar por apellido">
        <button type="submit" class="boton secundario">Buscar</button>
        <a th:if="${!#strings.isEmpty(apellido)}" th:href="@{/socios}">Quitar filtro</a>
    </form>

    <table class="tabla">
        <thead>
        <tr>
            <th>DNI</th>
            <th>Apellido</th>
            <th>Nombre</th>
            <th>Nacimiento</th>
            <th>Email</th>
            <th>Cuota</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="s : ${pagina.content}">
            <td th:text="${s.dni}">30111222</td>
            <td th:text="${s.apellido}">Pérez</td>
            <td th:text="${s.nombre}">Ana</td>
            <td th:text="${#temporals.format(s.fechaNacimiento, 'dd/MM/yyyy')}">01/01/1990</td>
            <td th:text="${s.email}">ana@mail.com</td>
            <td>
                <span th:if="${s.estadoCuota.name() == 'MOROSO'}" class="etiqueta error">Moroso</span>
                <span th:unless="${s.estadoCuota.name() == 'MOROSO'}" class="etiqueta ok">Al día</span>
            </td>
            <td class="acciones"><a th:href="@{/socios/{id}/editar(id=${s.id})}">Editar</a></td>
        </tr>
        <tr th:if="${pagina.empty}">
            <td colspan="7">No se encontraron socios.</td>
        </tr>
        </tbody>
    </table>

    <nav class="paginacion" th:if="${pagina.totalPages > 1}">
        <a th:if="${pagina.hasPrevious()}"
           th:href="@{/socios(apellido=${apellido}, page=${pagina.number - 1})}">&laquo; Anterior</a>
        <a th:each="n : ${#numbers.sequence(0, pagina.totalPages - 1)}"
           th:href="@{/socios(apellido=${apellido}, page=${n})}"
           th:text="${n + 1}" th:classappend="${n == pagina.number} ? 'activo'">1</a>
        <a th:if="${pagina.hasNext()}"
           th:href="@{/socios(apellido=${apellido}, page=${pagina.number + 1})}">Siguiente &raquo;</a>
    </nav>
    <p class="resumen" th:text="'Total: ' + ${pagina.totalElements} + ' socios'">Total: 24 socios</p>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
